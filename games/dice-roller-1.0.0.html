<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dice Roller</title>
<style>
  html,body{margin:0;height:100%;background:#14162b;color:#fff;font-family:system-ui,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  button{font-size:20px;padding:14px 28px;border-radius:14px;border:0;background:#4f7cff;color:#fff}
  .dim{opacity:.7}
</style></head><body>
<style>#d{font-size:96px}#t{min-height:24px;text-align:center;max-width:300px}</style>
<div id="d">🎲</div><div class="dim" id="t"></div><button id="r">Roll</button><div class="dim" id="h">Rolls: 0</div>
<script>
(function(){
var KEY='dice-roller:rolls',n=0;try{n=parseInt(localStorage.getItem(KEY)||'0',10)||0}catch(e){}
var d=document.getElementById('d'),t=document.getElementById('t'),h=document.getElementById('h'),F=['⚀','⚁','⚂','⚃','⚄','⚅'];
h.textContent='Rolls: '+n;
document.getElementById('r').onclick=function(){var v=Math.floor(Math.random()*6);d.textContent=F[v];n++;h.textContent='Rolls: '+n;try{localStorage.setItem(KEY,String(n))}catch(x){}
 t.textContent='';
 if(navigator.onLine&&v===5){fetch('https://api.github.com/zen').then(function(r){return r.text()}).then(function(x){t.textContent='Bonus: '+x}).catch(function(){})}};
})();
</script></body></html>
