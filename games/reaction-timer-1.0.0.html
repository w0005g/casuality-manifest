<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Reaction Timer</title>
<style>
  html,body{margin:0;height:100%;background:#14162b;color:#fff;font-family:system-ui,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  button{font-size:20px;padding:14px 28px;border-radius:14px;border:0;background:#4f7cff;color:#fff}
  .dim{opacity:.7}
</style></head><body>
<style>#pad{width:80vw;max-width:320px;height:200px;border-radius:20px;background:#a33;display:flex;align-items:center;justify-content:center;font-size:22px;text-align:center}#pad.go{background:#2e8b57}</style>
<div id="pad">Tap to start</div><div class="dim" id="b">Best: –</div>
<script>
(function(){
var KEY='reaction-timer:best',p=document.getElementById('pad'),b=document.getElementById('b'),st='idle',t0=0,to;
var best=null;try{best=parseInt(localStorage.getItem(KEY)||'',10)||null}catch(e){}
function lb(){b.textContent='Best: '+(best?best+' ms':'–')}lb();
p.onclick=function(){
 if(st==='idle'){st='wait';p.className='';p.textContent='Wait for green…';to=setTimeout(function(){st='go';p.className='go';p.textContent='TAP!';t0=Date.now()},1000+Math.random()*3000)}
 else if(st==='wait'){clearTimeout(to);st='idle';p.textContent='Too early! Tap to retry'}
 else{var ms=Date.now()-t0;st='idle';p.className='';p.textContent=ms+' ms. Tap to retry';if(!best||ms<best){best=ms;try{localStorage.setItem(KEY,String(ms))}catch(x){}lb()}}};
})();
</script></body></html>
