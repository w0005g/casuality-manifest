<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Daily Zen</title>
<style>
  html,body{margin:0;height:100%;background:#14162b;color:#fff;font-family:system-ui,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  button{font-size:20px;padding:14px 28px;border-radius:14px;border:0;background:#4f7cff;color:#fff}
  .dim{opacity:.7}
</style></head><body>
<style>#q{font-size:22px;text-align:center;max-width:300px;min-height:80px}</style>
<div id="q">Tap for a thought</div><button id="n">New thought</button><div class="dim" id="e"></div>
<script>
(function(){
var q=document.getElementById('q'),e=document.getElementById('e');
function load(){e.textContent='';q.textContent='…';
 fetch('https://api.github.com/zen',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text()})
 .then(function(t){q.textContent='“'+t+'”'}).catch(function(){q.textContent='';e.textContent='This game needs an internet connection.'})}
document.getElementById('n').onclick=load;load();
})();
</script></body></html>
